name: Deploy Pegada de Carbono Diária to GitHub Pages

# Trigger deployment on push to main branch (only when this project
# changes) or manually
on:
  push:
    branches:
      - main
    paths:
      - 'pegada-carbono-diaria/**'
      - '.github/workflows/deploy-pegada-carbono-diaria.yml'
  workflow_dispatch:

# Set permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'pegada-carbono-diaria'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
