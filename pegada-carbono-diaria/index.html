<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pegada de Carbono Diária</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <h1 class="header__title">🌍 Pegada de Carbono Diária</h1>
        <p class="header__subtitle">Descubra o impacto semanal dos seus hábitos e encontre formas de reduzi-lo</p>
    </header>

    <main class="main">
        <form id="footprint-form" class="footprint-form">
            <fieldset class="form-block">
                <legend class="form-block__legend">⚡ Energia</legend>
                <div class="form-group">
                    <label for="energy-kwh" class="form-group__label">Consumo de energia elétrica (kWh/semana)</label>
                    <input
                        type="number"
                        id="energy-kwh"
                        class="form-group__input"
                        min="0"
                        step="any"
                        value="0"
                    >
                </div>
            </fieldset>

            <fieldset class="form-block">
                <legend class="form-block__legend">🚗 Transporte (km/semana)</legend>
                <div class="transport-grid">
                    <div class="transport-grid__option">
                        <label for="transport-car" class="transport-grid__label">
                            <span class="transport-grid__icon">🚗</span>
                            <span class="transport-grid__text">Carro</span>
                            <input type="number" id="transport-car" class="transport-grid__input" min="0" step="any" value="0">
                        </label>
                    </div>
                    <div class="transport-grid__option">
                        <label for="transport-bus" class="transport-grid__label">
                            <span class="transport-grid__icon">🚌</span>
                            <span class="transport-grid__text">Ônibus</span>
                            <input type="number" id="transport-bus" class="transport-grid__input" min="0" step="any" value="0">
                        </label>
                    </div>
                    <div class="transport-grid__option">
                        <label for="transport-bicycle" class="transport-grid__label">
                            <span class="transport-grid__icon">🚲</span>
                            <span class="transport-grid__text">Bicicleta</span>
                            <input type="number" id="transport-bicycle" class="transport-grid__input" min="0" step="any" value="0">
                        </label>
                    </div>
                    <div class="transport-grid__option">
                        <label for="transport-walk" class="transport-grid__label">
                            <span class="transport-grid__icon">🚶</span>
                            <span class="transport-grid__text">A pé</span>
                            <input type="number" id="transport-walk" class="transport-grid__input" min="0" step="any" value="0">
                        </label>
                    </div>
                </div>
            </fieldset>

            <fieldset class="form-block">
                <legend class="form-block__legend">🍽️ Alimentação (refeições/semana)</legend>
                <div class="form-group">
                    <label for="food-red-meat" class="form-group__label">Refeições com carne vermelha</label>
                    <input type="number" id="food-red-meat" class="form-group__input" min="0" step="1" value="0">
                </div>
                <div class="form-group">
                    <label for="food-chicken-fish" class="form-group__label">Refeições com frango ou peixe</label>
                    <input type="number" id="food-chicken-fish" class="form-group__input" min="0" step="1" value="0">
                </div>
                <div class="form-group">
                    <label for="food-vegetarian" class="form-group__label">Refeições vegetarianas</label>
                    <input type="number" id="food-vegetarian" class="form-group__input" min="0" step="1" value="0">
                </div>
            </fieldset>

            <fieldset class="form-block">
                <legend class="form-block__legend">🗑️ Resíduos</legend>
                <div class="form-group">
                    <label for="waste-kg" class="form-group__label">Lixo gerado (kg/semana)</label>
                    <input type="number" id="waste-kg" class="form-group__input" min="0" step="any" value="0">
                </div>
                <div class="form-group">
                    <label for="waste-recycled" class="form-group__label">Percentual reciclado (%)</label>
                    <input type="number" id="waste-recycled" class="form-group__input" min="0" max="100" step="any" value="0">
                </div>
            </fieldset>

            <button type="submit" class="form-submit">Calcular Pegada de Carbono</button>
        </form>

        <section id="resultado-total" class="result-section hidden">
            <div id="resultado-total-content" class="result-section__content"></div>
        </section>

        <section id="resultado-categorias" class="result-section hidden">
            <div id="resultado-categorias-content" class="result-section__content"></div>
        </section>

        <section id="resultado-creditos" class="result-section hidden">
            <div id="resultado-creditos-content" class="result-section__content"></div>
        </section>
    </main>

    <footer class="footer">
        <p class="footer__credits">Projeto de conclusão do curso Formação GitHub Copilot (DIO)</p>
    </footer>

    <script src="js/config.js"></script>
    <script src="js/calculator.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
